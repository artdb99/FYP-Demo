name: Deploy FastAPI to Azure (App Service - publish profile)

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate deps (optional)
        working-directory: backend/fastapi
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Wait for SCM to settle
        run: sleep 90
        
      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 104384876FastAPI
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_STAGING_APP }}
          package: backend/fastapi
          clean: true